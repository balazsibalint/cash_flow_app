# Fejlesztői környezet hot-reloaddal (önállóan használandó):
#   docker compose -f docker-compose.dev.yml up --build
# Frontend: http://localhost:5173 (a /api kéréseket a Vite proxy továbbítja az app:8000-re)
# Külön projektnév: különben a dev image felülírná az éles `cash_flow_app-app` image-et,
# és a dev adatbázis is külön volume-ba kerül.
name: cash_flow_app_dev

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - app

volumes:
  sqlite_data:
